{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="error-page">
  <div class="wrap prose">
    <p class="error-code">{{ code }}</p>
    <h1>{{ title }}</h1>
    <p class="lead">{{ text }}</p>
    <div class="btn-row mt-lg">
      <a class="btn btn--navy" href="{{ url_for('index') }}">Go to home</a>
      <a class="btn btn--ghost" href="{{ url_for('contact') }}">Contact us</a>
    </div>
  </div>
</section>
{% endblock %}
