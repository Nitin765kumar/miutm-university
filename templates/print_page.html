<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ a.application_no }} | {{ site.short }}</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{{ asset('css/site.css') }}">
  <script src="{{ asset('js/boot.js') }}"></script>
</head>
<body>
{% from "partials/_macros.html" import icon %}
<div class="wrap print-bar no-print">
  <a class="btn btn--ghost btn--sm" href="{{ back_url }}">Back</a>
  <button class="btn btn--navy btn--sm" type="button" data-print>{{ icon('printer') }}<span>Print</span></button>
</div>
<main class="wrap sheet-section">
  <h1 class="sr-only">{{ 'Offer letter' if 'offer' in partial else 'Application form' }}</h1>
  {% include partial %}
</main>
{% include "partials/_sprite.html" %}
<script src="{{ asset('js/main.js') }}" defer></script>
</body>
</html>
