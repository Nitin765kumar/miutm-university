# Render blueprint. Commit this file, then choose "New > Blueprint" on Render.
services:
  - type: web
    name: miutm-university
    runtime: python
    plan: starter          # disk ke liye paid plan chahiye
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --preload --workers 2 --threads 4 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false        # Render dashboard me type karein; git me store nahi hota
      - key: DEMO_MODE
        value: "1"
      - key: SESSION_DAYS
        value: "90"
      # Optional: Admin register form par ye code maanga jayega
      - key: STAFF_SIGNUP_CODE
        sync: false
      # Optional email (README dekhein). Email ke bina chalana ho to inhe hata dein.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # SQLite database ka path (persistent disk par)
      - key: DATABASE_PATH
        value: /var/data/miutm.db
    # SQLite ko aisi disk chahiye jo restart ke baad bhi bachi rahe
    disk:
      name: miutm-data
      mountPath: /var/data
      sizeGB: 2
